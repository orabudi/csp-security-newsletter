# Your regions.
#
# Used by prefilter.py: region-expansion boilerplate is dropped UNLESS the item
# also matches a security term (§6.1). If an expansion names one of YOUR
# regions it is kept regardless — a security service landing in your region is
# news.
#
# `region_tokens` is the vocabulary used to recognise an item as a region
# announcement at all. Extend it if a provider invents new naming.

mine:
  - us-east-1
  - eu-west-1
  - eu-central-1
  - westeurope
  - northeurope
  - eastus
  - us-central1
  - europe-west1
  - eu-frankfurt-1

