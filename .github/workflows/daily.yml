name: daily-csp-security-tldr

on:
  schedule:
    - cron: '0 5 * * 1-5'   # 05:00 UTC, weekdays. Best-effort; 5-30 min late is fine.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render only, deliver nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # continue-on-error so state and the archive are still committed on a bad
      # day; the job is failed explicitly in the last step (§8).
      - name: Build and send digest
        id: digest
        continue-on-error: true
        run: python -m src.main ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
          LLM_MODEL:         ${{ vars.LLM_MODEL }}
          LLM_API_KEY:       ${{ secrets.LLM_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}

      # The daily commit is also what keeps GitHub from disabling the schedule
      # after ~60 days of repo inactivity (§4).
      - name: Commit state and archive
        if: always()
        run: |
          git config user.name  "sec-tldr-bot"
          git config user.email "actions@github.com"
          git add state.json docs/
          git diff --staged --quiet || git commit -m "digest $(date -u +%F)"
          git push

      - name: Fail the run if the digest needed attention
        if: steps.digest.outcome == 'failure'
        run: |
          echo "::error::digest run exited non-zero — check the log for feed rot," \
               "delivery failures or a degraded classifier"
          exit 1
